# Orca multi-model role orchestration
# MANAGED FILE — overwritten on every install re-run.
# User customization: edit project_hints.yaml (never roles.yaml).
# Personas live in personas/<role>.md (bootstrap seeds; dispatch uses STANCE).
# agent/model fields document defaults; launch lives in orca-bootstrap-roles.sh.

version: 1
worktree: active

roles:
  coordinator:
    description: >
      Decompose work into a DAG, route by role, dispatch, wait on
      worker_done/escalation, synthesize. Does not implement bulk code.
    agent: any
    model: any
    persona_file: personas/coordinator.md
    persona_summary: >-
      The Conductor — decompose into a DAG, route by model strength, dispatch,
      synthesize; never bulk-implement.
    owns:
      - task DAG design
      - decision gates
      - merge synthesis
      - escalation handling
    does_not:
      - large multi-file implementation (delegate)
      - bulk ticket grind (delegate)

  architect:
    handle_title: role-opus-architect
    agent: claude
    model: claude-opus-5
    effort: high
    persona_file: personas/architect.md
    persona_summary: >-
      The Strategist — plan, judge, and review high-stakes work with evidence;
      delegate bulk implementation; push back on weak plans.
    owns:
      - architecture / design
      - ambiguous requirements
      - multi-package / multi-service plans
      - PR / security / privacy / correctness review
      - long-horizon autonomous work when correctness > cost
    route_keywords:
      - architecture
      - design
      - plan
      - review
      - audit
      - security
      - privacy
      - migration
      - multi-service
      - judgment
      - decision

  executor:
    handle_title: role-sol-executor
    agent: codex
    model: gpt-5.6-sol
    effort: high
    persona_file: personas/executor.md
    persona_summary: >-
      The Closer — implement the approved plan end-to-end, verify before
      claiming done, integrate; escalate ambiguity to architect.
    owns:
      - hard multi-step implementation from an approved plan
      - terminal-heavy debug / fix loops
      - tests, typecheck, build verification
      - PR-sized end-to-end delivery
      - raster image generation and edit via Codex $imagegen skill
    route_keywords:
      - implement
      - implement hard
      - terminal
      - debug
      - reproduce
      - typecheck
      - build
      - test
      - codex
      - integrate
      - verify
      - ultra
      - image
      - imagegen
      - generate image
      - edit image
      - mockup
      - illustration
      - sprite
      - hero image
      - product shot
      - 이미지
      - 이미지 생성
      - 이미지 편집
      - 목업
      - 일러스트
      - 스프라이트

  thrifty:
    handle_title: role-grok-thrifty
    agent: grok
    model: grok-4.5
    effort: default
    persona_file: personas/thrifty.md
    persona_summary: >-
      The Scout — fast, cheap small/exploratory work; small diffs; cite
      sources; escalate design risk early.
    owns:
      - well-scoped tickets and small diffs
      - codebase search / navigation / mechanical renames
      - prototypes and throwaway demos
      - external research and alternative generation
      - docs polish, high-volume low-risk codegen
    route_keywords:
      - small fix
      - rename
      - docs
      - prototype
      - research
      - alternatives
      - volume
      - cheap
      - navigate
      - map code
      - explore

  ui:
    handle_title: role-agy-ui
    agent: antigravity
    cli: agy
    model: "Gemini 3.6 Flash (Medium)"
    effort: medium
    persona_file: personas/ui.md
    persona_summary: >-
      The Set Designer — own the user-visible surface; draft fast and cheap;
      route every draft back to architect for approval; never change system structure.
    owns:
      - UI / UX surface work and frontend visual implementation
      - layout, spacing, typography, color, motion, component states
      - design-system conformance and reuse
      - lightweight design drafts: wireframes, mockups, visual spikes, copy passes
      - visual accessibility (contrast, focus order, labels)
    does_not:
      - system architecture, data flow, API / schema contracts (→ architect)
      - approving its own drafts (→ architect gate, always)
      - hard multi-file backend implementation (→ executor)
      - acting as the rate/session-limit safety net (→ fallback)
    route_keywords:
      - ui
      - ux
      - frontend visual
      - layout
      - spacing
      - typography
      - styling
      - css
      - component look
      - design system
      - mockup
      - wireframe
      - design draft
      - visual spike
      - responsive
      - contrast
    notes: |
      Shares the agy CLI and the Gemini 3.6 Flash (Medium) quota with `fallback`.
      Never fail ui over to fallback (same provider, same limit) — use thrifty instead.

  reviewer:
    handle_title: role-opus-reviewer
    agent: claude
    model: claude-opus-5
    effort: high
    persona_file: personas/reviewer.md
    persona_summary: >-
      The Gatekeeper — final pre-merge gate only; APPROVE or BLOCK with evidence;
      never implement, never take over day-to-day review.
    owns:
      - the single pre-merge final approval on a completed, already-reviewed change
      - a binary APPROVE / BLOCK verdict with file:line evidence
    does_not:
      - day-to-day / in-flight review (→ architect keeps this entirely)
      - planning, architecture, or design (→ architect)
      - any edit at all, including a one-line fix (→ executor / ui)
      - being primary for anything except the final gate
    route_keywords:
      - final gate
      - pre-merge
      - merge approval
      - ship approval
      - final review
      - sign-off
      - release gate
    entry_condition: |
      Dispatch reviewer ONLY when all hold: implementation complete, its own
      verification green, architect's in-flight findings resolved. Otherwise
      reviewer returns BLOCK "not gate-ready" without reviewing.
    notes: |
      Shares the claude CLI and the claude-opus-5 quota with `architect`. If
      architect is session-limited, reviewer very likely is too — defer the gate
      rather than downgrade it to a weaker model.

  debater_claude:
    handle_title: debate-opus
    agent: claude
    model: claude-opus-5
    effort: high
    persona_file: personas/debater_claude.md
    persona_summary: >-
      The Principled Skeptic — debate seat arguing long-horizon coherence,
      failure modes, and regulatory exposure. Read-only.
    owns:
      - the principle-and-risk lens in an idea debate
    does_not:
      - any file edit outside its assigned debate output file
      - implementation of any kind

  debater_codex:
    handle_title: debate-sol
    agent: codex
    model: gpt-5.6-sol
    effort: high
    persona_file: personas/debater_codex.md
    persona_summary: >-
      The Builder — debate seat arguing build cost, technical risk, and the
      shortest credible path to a shippable slice. Read-only.
    owns:
      - the feasibility lens in an idea debate
    does_not:
      - any file edit outside its assigned debate output file
      - implementation of any kind

  debater_grok:
    handle_title: debate-grok
    agent: grok
    model: grok-4.5
    effort: default
    persona_file: personas/debater_grok.md
    persona_summary: >-
      The Contrarian — debate seat sweeping prior art and attacking the
      consensus angle. Read-only.
    owns:
      - the contrarian-and-market lens in an idea debate
    does_not:
      - any file edit outside its assigned debate output file
      - implementation of any kind

  debater_gemini:
    handle_title: debate-agy
    agent: antigravity
    cli: agy
    model: "Gemini 3.6 Flash (Medium)"
    effort: medium
    persona_file: personas/debater_gemini.md
    persona_summary: >-
      The User's Advocate — debate seat demanding evidence that a specific
      person wants this. Read-only.
    owns:
      - the demand-and-user lens in an idea debate
    does_not:
      - any file edit outside its assigned debate output file
      - implementation of any kind
    notes: |
      Shares the agy CLI and Gemini quota with `ui` and `fallback`. On a limit,
      re-run the debate with --debaters minus gemini rather than substituting
      another model — swapping a model destroys the lens diversity.

  fallback:
    handle_title: role-agy-fallback
    agent: antigravity
    cli: agy
    model: "Gemini 3.6 Flash (Medium)"
    effort: medium
    persona_file: personas/fallback.md
    persona_summary: >-
      The Relief Pitcher — enter only on a primary's limit; smallest viable
      progress; stabilize and hand back; never re-architect.
    owns:
      - continue work when primaries are rate/session limited
      - low-to-medium complexity fixes while primaries cool down
    route_keywords:
      - rate limit
      - session limit
      - overloaded
      - quota
      - fallback
      - agy
      - antigravity
    triggers_on:
      - "You've hit your session limit"
      - "rate limit"
      - "usage limit"
      - "overloaded"
      - "quota exceeded"
      - "try again later"
      - "429"
    notes: |
      Cross-provider failover is orchestration-level (redispatch ROLE=fallback).
      Claude --fallback-model only supports Anthropic models.

routing_table:
  - match: architecture_or_plan
    when: "New feature design, ambiguous requirements, multi-package impact"
    primary: architect
  - match: high_risk_review
    when: "auth, PII, security, migrations, privacy, high-stakes ship"
    primary: architect
    secondary: executor
  - match: hard_implementation
    when: "Approved plan, multi-file non-trivial code, tool-heavy debug"
    primary: executor
    secondary: thrifty
  - match: terminal_agent_loop
    when: "Shell-heavy repro, multi-step CLI workflow"
    primary: executor
  - match: image_generation
    when: >
      User wants a new or edited raster image (hero, mockup, illustration,
      sprite, product shot, transparent cutout, etc.). Not SVG/vector/code-native icons.
    primary: executor
    notes: |
      Coordinator clarity gate BEFORE dispatch:
      enough brief = subject + intended use (+ style/destination if project-bound).
      If missing critical slots → ask user; do not dispatch.
      Spec MUST require Codex $imagegen skill only
      (${CODEX_HOME:-$HOME/.codex}/skills/.system/imagegen/SKILL.md).
      Do not route to thrifty/Grok image tools.
  - match: small_ticket
    when: "Clear 1-3 file change, docs polish, rename"
    primary: thrifty
  - match: codebase_map
    when: "Find where X lives (read-only)"
    primary: thrifty
  - match: research_or_alternatives
    when: "External research, competitor/platform alternatives"
    primary: thrifty
    secondary: architect
  - match: idea_debate
    when: >
      User wants to research and sharpen an idea by having multiple models
      argue it out — brainstorming, idea refinement, finding a niche or
      differentiated direction. Korean triggers: 아이디어 토론, 브레인스토밍,
      아이디어 구체화, 니치 찾기.
    primary: coordinator
    notes: |
      Do not dispatch debaters one at a time. Run the driver:
        .orca/orchestration/scripts/orca-debate.sh --topic "<goal>"
      Three rounds: propose → critique (anonymized) → converge.
      Round prompt text lives in scripts/orca-debate-lib.sh (single source);
      it is deliberately not duplicated here.
      Output: debates/<slug>/transcript.md, then a decision document in
      docs/ideas/ written by the coordinator (or --judge <role>).
  - match: prototype
    when: "Spike / demo / one-shot mock (code/UI, not raster image generation)"
    primary: thrifty
    secondary: architect
  - match: verification
    when: "typecheck, build, test, integrate"
    primary: executor
  - match: ui_surface_work
    when: "UI / UX, frontend visuals, layout, styling, component look-and-feel, contrast"
    primary: ui
    secondary: architect
  - match: ui_draft
    when: "Cheap first-pass wireframe / mockup / visual spike / copy pass"
    primary: ui
    secondary: architect
  - match: dual_review
    when: "High stakes ship gate"
    primary: architect
    secondary: executor
  - match: final_merge_gate
    when: "Change complete + verified + architect findings resolved; about to merge/ship"
    primary: reviewer
    terminal: true

dags:
  feature_plan_execute_review:
    description: Standard feature delivery
    steps:
      - id: plan
        role: architect
        deps: []
        spec_template: |
          ROLE=architect. Plan only for:
          {{user_goal}}
          Follow project AGENTS.md / CLAUDE.md constraints if present.
          Output: file list, risks, verification commands. No bulk implement unless trivial.
      - id: implement
        role: executor
        deps: [plan]
        spec_template: |
          ROLE=executor. Implement ONLY the approved plan:
          {{plan_result}}
          Stay in listed files. Run verification. Ask if blocked.
      - id: review
        role: architect
        deps: [implement]
        spec_template: |
          ROLE=architect (review-only). Check correctness, project constraints, security.
          Do NOT edit unless critical one-line fix. Report findings for coordinator.

  small_fix_fast:
    description: Low-risk quick fix
    steps:
      - id: fix
        role: thrifty
        deps: []
        spec_template: |
          ROLE=thrifty. Minimal fix for:
          {{user_goal}}
          Smallest diff. Lightest relevant verification.

  high_risk_change:
    description: Auth / PII / security / migration
    steps:
      - id: plan
        role: architect
        deps: []
      - id: implement
        role: executor
        deps: [plan]
      - id: dual_review
        role: architect
        deps: [implement]
      - id: verify
        role: executor
        deps: [dual_review]

  explore_then_build:
    description: Unknown area
    steps:
      - id: map
        role: thrifty
        deps: []
        spec_template: |
          ROLE=thrifty (read-only). Map {{topic}}. file:line table. No edits.
      - id: plan
        role: architect
        deps: [map]
      - id: implement
        role: thrifty
        deps: [plan]

  research_then_integrate:
    description: External research into project
    steps:
      - id: research
        role: thrifty
        deps: []
      - id: critique
        role: architect
        deps: [research]
      - id: integrate
        role: executor
        deps: [critique]

  image_generate:
    description: Raster image via Codex $imagegen (after brief is clear)
    steps:
      - id: generate
        role: executor
        deps: []
        spec_template: |
          ROLE=executor. Image task for {{PROJECT_NAME}}.
          Use Codex skill $imagegen ONLY
          (read ${CODEX_HOME:-$HOME/.codex}/skills/.system/imagegen/SKILL.md).
          Do NOT use other image APIs, Grok/Claude image tools, or invent scripts.

          Brief (already clarified with user):
          {{image_brief}}

          Rules:
          - Built-in image_gen path inside $imagegen by default
          - CLI fallback only if user explicitly confirmed
          - Project-bound assets: copy final file into workspace; report absolute path
          - Do not overwrite existing assets unless user asked to replace
          - If brief is still missing a success-critical detail → escalate/ask; do not invent

          Done: final path(s) + short prompt used + built-in vs CLI mode.

  ui_feature:
    description: User-visible feature — surface first, architect-approved
    steps:
      - id: draft
        role: ui
        deps: []
        spec_template: |
          ROLE=ui. Produce a DRAFT ONLY of the user-visible surface for:
          {{user_goal}}
          Cover default / loading / empty / error states, responsive behaviour,
          contrast + focus order. Reuse the existing design system.
          No architecture, schema, or API changes.
          Output: surface spec + the exact files an implementation would touch.
          Label it DRAFT — needs architect approval.
      - id: approve
        role: architect
        deps: [draft]
        spec_template: |
          ROLE=architect (approval gate). Approve, amend, or reject this design draft:
          {{draft_result}}
          Judge structural impact, contract impact, and feasibility.
          Output an approved surface spec, or a rejection with the reason.
      - id: implement
        role: ui
        deps: [approve]
        spec_template: |
          ROLE=ui. Implement ONLY the approved surface spec:
          {{approve_result}}
          Stay in the listed files. No architecture changes.
          Run the project's lint/typecheck and report the output.
      - id: review
        role: architect
        deps: [implement]

  final_merge_gate:
    description: Terminal pre-merge approval — attach to any flow, never run standalone
    steps:
      - id: gate
        role: reviewer
        deps: []
        spec_template: |
          ROLE=reviewer (FINAL GATE, review-only). VERDICT: APPROVE or VERDICT: BLOCK.
          Preconditions: complete, verified, architect findings resolved — if any is
          unmet, BLOCK as "not gate-ready" without reviewing further.
          BLOCK needs blocking findings with file:line evidence, why each blocks,
          a fix path, and who fixes it. Never edit a file.

  idea_debate:
    description: Multi-model idea debate — propose, critique, converge on a niche
    driver: .orca/orchestration/scripts/orca-debate.sh
    steps:
      - id: propose
        role: debater_claude, debater_codex, debater_grok, debater_gemini
        deps: []
      - id: critique
        role: same four, reading anonymized proposals
        deps: [propose]
      - id: converge
        role: same four, reading anonymized critiques
        deps: [critique]
      - id: decide
        role: coordinator
        deps: [converge]

limit_failover:
  enabled: true
  target_role: fallback
  agent: antigravity
  model: "Gemini 3.6 Flash (Medium)"
  # Detection patterns live ONLY in scripts/orca-fallback-on-limit.sh (LIMIT_RE).
  # A copy here has no consumer — nothing parses this file — and the two had
  # already drifted, so the copy is deleted rather than re-synced.
  policy: |
    1. Do not hammer the limited primary
    2. Create NEW task ROLE=fallback with goal + partial progress
    3. Dispatch --inject to role-agy-fallback
    4. Script: .orca/orchestration/scripts/orca-fallback-on-limit.sh --from <role> --spec "..."
  script: .orca/orchestration/scripts/orca-fallback-on-limit.sh

lifecycle:
  supervised_only_when:
    - user asks to supervise / monitor / wait / coordinate DAG / decision gate
  worker_done_required: true
  max_concurrent: 2
  debate:
    # Debate rounds fan out to 4 read-only participants at once. max_concurrent
    # exists to stop two roles editing the same files; debaters edit nothing, so
    # the debate path is exempt.
    max_concurrent: 4
    # PROMPT-ENFORCED, NOT A FACT: debaters run under the same permission-bypass
    # CLI flags as every other role (see role_launch_cmd in orca-roles-lib.sh).
    # Nothing sandboxes them — "read-only" here means the dispatch spec and
    # persona instruct them to write only their own output file and never touch
    # git state; a debater that ignored those instructions could write anywhere
    # its OS user can. Do not read this field as a security boundary.
    read_only: true
    tabs_persist_between_rounds: true   # dispatch --persist; driver closes on exit
    driver_script: .orca/orchestration/scripts/orca-debate.sh
  wait_timeout_ms: 900000
  circuit_break_after_failures: 3
  edit_ownership: |
    One role edits a given file set at a time.
    Review-only architect must not rewrite executor/thrifty files unless re-dispatched.
  on_rate_limit: redispatch_to_fallback
  # Supervised role tabs are ephemeral: one live tab per in-flight dispatch,
  # closed on worker_done, recreated on the next dispatch (not long-lived warm pools).
  close_terminal_after_done: true   # automatic via orca-reap-task.sh + worker AUTO-CLOSE
  recreate_terminal_on_dispatch: true  # dispatch rebuilds a dead/missing role tab
  reaper_script: .orca/orchestration/scripts/orca-reap-task.sh
  wait_script: .orca/orchestration/scripts/orca-wait-done.sh  # optional blocking only
