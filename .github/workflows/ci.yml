name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Bash 3.2 on macOS is the compatibility floor; ubuntu catches the rest.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # install-to-project.sh stamps `git describe --tags`

      - name: Bash version
        run: bash --version

      - name: Repo lint (manifests, command/prompt pairs, personas)
        run: tests/repo-lint.sh

      - name: Installer tests
        run: tests/install.sh

      - name: Runtime tests (fake orca on PATH)
        run: tests/runtime.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        # -S warning: style/info are suggestions, not requirements (per
        # shellcheck's own severity model) — this repo's test files rely
        # heavily on deliberate patterns (per-test subshell env scoping,
        # debug-capture variables) that only trip info/style-tier checks.
        run: shellcheck -S warning scripts/*.sh tests/*.sh tests/fake-orca/orca
